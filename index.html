<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>English Review Cards</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">IELTS English Review</p>
        <h1>英文词组、好句与好文复习卡片</h1>
      </div>
      <div class="stats" aria-label="复习筛选">
        <button class="stat-filter active" data-filter="all" type="button">
          <strong id="total-count">0</strong> 全部
        </button>
        <button class="stat-filter" data-filter="mastered" type="button">
          <strong id="mastered-count">0</strong> 已掌握
        </button>
        <button class="stat-filter" data-filter="priority" type="button">
          <strong id="priority-count">0</strong> 重点
        </button>
      </div>
    </header>

    <main class="list-page">
      <section class="list-layout" aria-label="词条索引">
        <div class="index-panel">
          <div class="section-heading">
            <h2 id="list-heading">全部记录</h2>
            <span id="visible-count">0</span>
          </div>
          <div class="index-counts">
            <a href="#phrases-section">词组 <strong id="phrase-count">0</strong></a>
            <a href="#sentences-section">好句 <strong id="sentence-count">0</strong></a>
            <a href="#articles-section">好文 <strong id="article-count">0</strong></a>
          </div>
          <section id="phrases-section" class="entry-section">
            <h3>词组</h3>
            <div id="phrase-list" class="entry-list"></div>
          </section>
          <section id="sentences-section" class="entry-section">
            <h3>语句</h3>
            <div id="sentence-list" class="entry-list"></div>
          </section>
          <section id="articles-section" class="entry-section">
            <h3>好文</h3>
            <div id="article-list" class="entry-list"></div>
          </section>
        </div>
      </section>

      <p id="empty-state" class="empty-state" hidden>还没有记录。</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
