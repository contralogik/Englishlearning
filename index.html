<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>English Review Cards</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">IELTS English Review</p>
        <h1>英文词组与好句复习卡片</h1>
      </div>
      <div class="stats" aria-label="复习统计">
        <span><strong id="total-count">0</strong> 条内容</span>
        <span><strong id="mastered-count">0</strong> 已掌握</span>
      </div>
    </header>

    <main>
      <section class="review-layout">
        <aside class="index-panel" aria-label="词条索引">
          <div class="section-heading">
            <h2>全部记录</h2>
            <span id="visible-count">0</span>
          </div>
          <div class="index-counts">
            <span>词组 <strong id="phrase-count">0</strong></span>
            <span>好句 <strong id="sentence-count">0</strong></span>
          </div>
          <section class="entry-section">
            <h3>词组</h3>
            <div id="phrase-list" class="entry-list"></div>
          </section>
          <section class="entry-section">
            <h3>语句</h3>
            <div id="sentence-list" class="entry-list"></div>
          </section>
        </aside>

        <section class="detail-panel" aria-label="词条详情">
          <div class="section-heading">
            <h2>详细释义</h2>
            <span id="selected-position">-</span>
          </div>
          <div id="detail-card"></div>
        </section>
      </section>

      <p id="empty-state" class="empty-state" hidden>没有匹配的内容。换个关键词或标签试试。</p>
    </main>

    <template id="card-template">
      <article class="review-card">
        <div class="card-header">
          <span class="card-type"></span>
          <button class="mastery-button" type="button"></button>
        </div>
        <h3></h3>
        <dl></dl>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
